# ============================================================
# CMS Platform — CI/CD Pipeline
# Triggers: push to main / develop + PRs to main
# ============================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  DOTNET_VERSION: "9.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================
  # JOB 0: Security Artifact Gate
  # =========================================================
  security-gate:
    name: Security Artifact Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and mutable actions
        run: bash scripts/ci/verify-security-artifact.sh

  # =========================================================
  # JOB 1: Backend Tests
  # =========================================================
  backend-test:
    needs: [security-gate]
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore apps/api/CMS.sln

      - name: Build
        run: dotnet build apps/api/CMS.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test apps/api/CMS.sln --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            apps/api/src/CMS.Tests/TestResults/
            apps/api/src/CMS.Tests/**/coverage.cobertura.xml

  # =========================================================
  # JOB 2: Frontend Tests
  # =========================================================
  frontend-test:
    name: Frontend Tests
    needs: [security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @cms/student-web lint

      - name: Run tests
        run: pnpm --filter @cms/student-web exec vitest run

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm --filter @cms/student-web build
        env:
          VITE_API_URL: https://staging-api.cms.example.com/api/v1
          VITE_APP_ENV: staging

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/sbom
          pnpm --filter @cms/student-web list --prod --json --depth Infinity > artifacts/sbom/student-web.pnpm.json
          node scripts/ci/generate-cyclonedx-from-pnpm.js artifacts/sbom/student-web.pnpm.json artifacts/sbom/student-web.cdx.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/student-web/dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: artifacts/sbom/student-web.cdx.json

  # =========================================================
  # JOB 3: Security Scan (CodeQL + Trivy)
  # =========================================================
  security-scan:
    name: Security Scan
    needs: [security-gate]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript-typescript
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # =========================================================
  # JOB 4: Lighthouse CI
  # =========================================================
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @cms/student-web build
        env:
          VITE_API_URL: https://staging-api.cms.example.com/api/v1

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # =========================================================
  # JOB 5: Build & Push Docker Images
  # =========================================================
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/cms-api
            ghcr.io/${{ github.repository }}/cms-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/cms-api:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/student-web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/cms-web:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://${{ github.ref_name == 'main' && 'api' || 'staging-api' }}.cms.example.com/api/v1
            VITE_APP_ENV=${{ github.ref_name == 'main' && 'production' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # JOB 6: Deploy to Staging (develop branch)
  # =========================================================
  # DISABLED: Railway is no longer the backend host (Render is, via auto-deploy from main).
  # The custom domains (staging-app.cms.example.com) are not deployed either.
  # Re-enable only if/when a staging pipeline is reintroduced with Render or Vercel.
  deploy-staging:
    name: Deploy to Staging (disabled — Railway removed)
    if: false  # was: github.ref == 'refs/heads/develop'
    needs: [docker-build, security-scan]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-app.cms.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway (Staging)
        uses: bervProject/railway-deploy@v3
        with:
          service: ${{ secrets.RAILWAY_API_SERVICE_STAGING }}
          token: ${{ secrets.RAILWAY_TOKEN }}
          definition_file: railway.toml

      - name: Deploy Frontend to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
          vercel-args: "--prod"
          working-directory: ./apps/student-web
          vercel-project-name: cms-student-web-staging

  # =========================================================
  # JOB 7: Deploy to Production (main branch)
  # =========================================================
  # DISABLED: Railway is no longer the backend host. Render auto-deploys from main on push.
  # Vercel also auto-deploys student-web and admin-web on push to main.
  # This job is preserved for reference but will never run (if: false).
  deploy-production:
    name: Deploy to Production (disabled — Render/Vercel auto-deploy)
    if: false  # was: github.ref == 'refs/heads/main'
    needs: [docker-build, security-scan, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.cms.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway (Production)
        uses: bervProject/railway-deploy@v3
        with:
          service: ${{ secrets.RAILWAY_API_SERVICE_PRODUCTION }}
          token: ${{ secrets.RAILWAY_TOKEN }}
          definition_file: railway.toml

      - name: Deploy Frontend to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
          vercel-args: "--prod"
          working-directory: ./apps/student-web
          vercel-project-name: cms-student-web
          scope: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Notify Sentry of new release
        run: |
          curl -X POST "https://sentry.io/api/0/organizations/cms/releases/" \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"${{ github.sha }}\",
              \"environment\": \"production\",
              \"projects\": [\"cms-backend\", \"cms-frontend\"]
            }"

      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: "#deployments"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
