# ============================================================
# CMS Platform — Production Launch Workflow
# One-time manual workflow for v1.0.0 production launch
# ============================================================
name: 🚀 Production Launch

on:
  workflow_dispatch:
    inputs:
      launch_version:
        description: 'Launch version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      confirm_launch:
        description: 'Type "LAUNCH" to confirm'
        required: true
        default: ''

env:
  DOTNET_VERSION: '9.0'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # JOB 1: Pre-Launch Verification
  # ============================================================
  pre-launch-check:
    name: 🔍 Pre-Launch Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_launch == 'LAUNCH'
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: set-version
        run: echo "version=${{ github.event.inputs.launch_version }}" >> $GITHUB_OUTPUT

      - name: Verify pre-conditions
        run: |
          echo "=== Pre-Launch Verification ==="
          echo "Version: ${{ github.event.inputs.launch_version }}"
          echo "Confirmed: ${{ github.event.inputs.confirm_launch }}"
          echo ""
          echo "✓ Workflow triggered with explicit confirmation"
          echo "✓ Running on branch: ${{ github.ref_name }}"

      - name: Run all tests
        run: |
          echo "→ Running Backend tests..."
          dotnet test apps/api/CMS.sln -c Release --verbosity quiet

          echo "→ Running Frontend tests..."
          cd apps/student-web
          pnpm install --frozen-lockfile
          pnpm test --run
          pnpm build

      - name: Security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Create Git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a ${{ github.event.inputs.launch_version }} -m "Production launch ${{ github.event.inputs.launch_version }}"
          git push origin ${{ github.event.inputs.launch_version }}

      - name: Notify team
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          fields: repo,message,commit,author
          custom_payload: |
            {
              text: "🚀 PRODUCTION LAUNCH STARTED",
              attachments: [{
                color: "good",
                fields: [
                  { title: "Version", value: "${{ github.event.inputs.launch_version }}", short: true },
                  { title: "Triggered by", value: "${{ github.actor }}", short: true },
                  { title: "Pre-launch checks", value: "✅ All passed" }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================
  # JOB 2: Apply Database Migrations
  # ============================================================
  apply-migrations:
    name: 🗄️ Apply Database Migrations
    runs-on: ubuntu-latest
    needs: pre-launch-check
    environment:
      name: production
      url: https://api.cms.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install EF Tool
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Restore dependencies
        run: dotnet restore apps/api/CMS.sln

      - name: Apply migrations to production
        run: |
          cd apps/api
          dotnet ef database update \
            --project src/CMS.Infrastructure \
            --startup-project src/CMS.Api \
            --connection "${{ secrets.PRODUCTION_DATABASE_URL }}"

      - name: Verify migrations applied
        run: |
          cd apps/api
          dotnet ef migrations list \
            --project src/CMS.Infrastructure \
            --startup-project src/CMS.Api \
            --connection "${{ secrets.PRODUCTION_DATABASE_URL }}" \
            | tee migrations-applied.txt
          echo "=== Applied migrations ==="
          cat migrations-applied.txt

      - name: Upload migration log
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: apps/api/migrations-applied.txt

  # ============================================================
  # JOB 3: Load Seed Data
  # ============================================================
  load-seed-data:
    name: 🌱 Load Production Seed Data
    runs-on: ubuntu-latest
    needs: apply-migrations
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Load seed data
        run: |
          echo "→ Loading production seed data..."
          psql "${{ secrets.PRODUCTION_DATABASE_URL }}" \
            -f deploy/seed/seed-production.sql \
            -v ON_ERROR_STOP=1

      - name: Verify seed data
        run: |
          echo "→ Verifying seed data..."
          psql "${{ secrets.PRODUCTION_DATABASE_URL }}" -c "
            SELECT 'Universities' AS table_name, COUNT(*) AS count FROM universities
            UNION ALL
            SELECT 'Colleges', COUNT(*) FROM colleges
            UNION ALL
            SELECT 'Academic Years', COUNT(*) FROM academic_years
            UNION ALL
            SELECT 'Subjects', COUNT(*) FROM subjects
            UNION ALL
            SELECT 'Admins', COUNT(*) FROM admins
            UNION ALL
            SELECT 'Questions', COUNT(*) FROM questions
            UNION ALL
            SELECT 'System Settings', COUNT(*) FROM system_settings;
          "

  # ============================================================
  # JOB 4: Deploy Backend to Railway
  # ============================================================
  deploy-backend:
    name: 🚂 Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: load-seed-data
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v3
        with:
          service: ${{ secrets.RAILWAY_API_SERVICE_PRODUCTION }}
          token: ${{ secrets.RAILWAY_TOKEN }}
          definition_file: railway.toml

      - name: Wait for backend health
        run: |
          echo "→ Waiting for backend to be healthy..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.cms.example.com/health/live 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Backend is healthy (attempt $i)"
              exit 0
            fi
            echo "  Attempt $i/60: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "✗ Backend failed to become healthy within 10 minutes"
          exit 1

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          custom_payload: |
            {
              text: "✅ Backend deployed to production",
              attachments: [{
                color: "good",
                fields: [
                  { title: "Service", value: "CMS API", short: true },
                  { title: "URL", value: "https://api.cms.example.com", short: true },
                  { title: "Health", value: "✅ Healthy" }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================
  # JOB 5: Deploy Frontend to Vercel
  # ============================================================
  deploy-frontend:
    name: ▲ Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
          vercel-args: '--prod'
          working-directory: ./apps/student-web
          scope: ${{ secrets.VERCEL_TEAM_ID }}
        env:
          VITE_API_URL: https://api.cms.example.com/api/v1
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ needs.pre-launch-check.outputs.version }}

      - name: Wait for frontend health
        run: |
          echo "→ Waiting for frontend to be accessible..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://app.cms.example.com 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Frontend is accessible (attempt $i)"
              exit 0
            fi
            echo "  Attempt $i/30: HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "✗ Frontend failed to become accessible within 2.5 minutes"
          exit 1

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          custom_payload: |
            {
              text: "✅ Frontend deployed to production",
              attachments: [{
                color: "good",
                fields: [
                  { title: "Service", value: "CMS Student Web", short: true },
                  { title: "URL", value: "https://app.cms.example.com", short: true }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================
  # JOB 6: Run Smoke Tests
  # ============================================================
  smoke-tests:
    name: 🧪 Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x deploy/scripts/smoke-tests.sh

      - name: Run smoke tests
        run: ./deploy/scripts/smoke-tests.sh production
        continue-on-error: false

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            smoke-test-output.txt
            /tmp/smoke-tests-*.log

      - name: Notify smoke tests
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          custom_payload: |
            {
              text: "${{ job.status == 'success' && '✅' || '❌' }} Smoke tests ${{ job.status == 'success' && 'passed' || 'FAILED' }}",
              attachments: [{
                color: "${{ job.status == 'success' && 'good' || 'danger' }}",
                fields: [
                  { title: "Environment", value: "Production", short: true },
                  { title: "URL", value: "https://app.cms.example.com", short: true }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================================
  # JOB 7: Create Sentry Release
  # ============================================================
  sentry-release:
    name: 📊 Create Sentry Release
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.launch_version }}-${{ github.sha }}"
          
          # Create release
          curl -X POST "https://sentry.io/api/0/organizations/cms/releases/" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\": \"$VERSION\",
              \"environment\": \"production\",
              \"projects\": [\"cms-backend\", \"cms-frontend\"],
              \"commits\": [{
                \"repository\": \"${{ github.repository }}\",
                \"id\": \"${{ github.sha }}\"
              }]
            }"

          echo "✓ Sentry release created: $VERSION"

  # ============================================================
  # JOB 8: Final Announcement
  # ============================================================
  announce-launch:
    name: 📣 Announce Production Launch
    runs-on: ubuntu-latest
    needs: sentry-release
    steps:
      - name: Send launch announcement
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#announcements'
          custom_payload: |
            {
              text: "🎉🚀 CMS PLATFORM v1.0.0 IS LIVE! 🚀🎉",
              attachments: [{
                color: "good",
                fields: [
                  { title: "Version", value: "${{ github.event.inputs.launch_version }}", short: true },
                  { title: "Status", value: "✅ Production Live", short: true },
                  { title: "Student App", value: "https://app.cms.example.com", short: false },
                  { title: "API", value: "https://api.cms.example.com", short: false },
                  { title: "Admin Dashboard", value: "https://admin.cms.example.com", short: false },
                  { title: "Status Page", value: "https://status.cms.example.com", short: false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.launch_version }}
          name: "🚀 CMS Platform ${{ github.event.inputs.launch_version }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Launch summary
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║   🎉 PRODUCTION LAUNCH COMPLETED! 🎉          ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║                                              ║"
          echo "║   Version: ${{ github.event.inputs.launch_version }}                ║"
          echo "║                                              ║"
          echo "║   ✅ Pre-launch verification                 ║"
          echo "║   ✅ Database migrations applied             ║"
          echo "║   ✅ Seed data loaded                        ║"
          echo "║   ✅ Backend deployed to Railway             ║"
          echo "║   ✅ Frontend deployed to Vercel             ║"
          echo "║   ✅ Smoke tests passed                      ║"
          echo "║   ✅ Sentry release created                  ║"
          echo "║   ✅ GitHub release published                ║"
          echo "║   ✅ Team notified via Slack                 ║"
          echo "║                                              ║"
          echo "║   🌐 Production URLs:                        ║"
          echo "║   • https://app.cms.example.com              ║"
          echo "║   • https://api.cms.example.com              ║"
          echo "║   • https://admin.cms.example.com            ║"
          echo "║                                              ║"
          echo "╚══════════════════════════════════════════════╝"
