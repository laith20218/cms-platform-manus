# ============================================================
# CMS Platform — Health Check Workflow
# Runs every 5 minutes to verify production uptime
# ============================================================
name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-24.04
    steps:
      # Wave 15.5c (DEBT-HEALTH-ENDPOINT): uptime semantics only, so the cron hits
      # /health/live (pure liveness — no DB). The previous /health target ran the
      # "ready" checks (NpgSql + Redis) on EVERY 5-minute tick, which kept the Neon
      # Postgres compute awake 24/7 (owner hit 82.8% of the free-tier allowance;
      # UptimeRobot was paused for the same reason). Readiness is verified post-deploy
      # by deploy/scripts/deploy.sh via /health/ready instead.
      - name: Check API Health (Production)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://cms-api-preview.onrender.com/health/live)
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::API health check failed with status $RESPONSE"
            exit 1
          fi
          echo "::notice::API is healthy (HTTP $RESPONSE)"

      - name: Check Frontend Health (Production)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://cms-platform-manus-student-web.vercel.app/)
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Frontend health check failed with status $RESPONSE"
            exit 1
          fi
          echo "::notice::Frontend is healthy (HTTP $RESPONSE)"

      # PR-10 (gap-matrix row 21 closure): the admin web production URL was absent
      # from this workflow — the student web was monitored, the admin web was not.
      - name: Check Admin Web Health (Production)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://cms-platform-manus-admin-web.vercel.app/)
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Admin web health check failed with status $RESPONSE"
            exit 1
          fi
          echo "::notice::Admin web is healthy (HTTP $RESPONSE)"

      - name: Check API Response Time
        run: |
          TIME=$(curl -s -o /dev/null -w "%{time_total}" https://cms-api-preview.onrender.com/health/live)
          echo "API response time: ${TIME}s"
          # Alert if slower than 2 seconds
          if (( $(echo "$TIME > 2.0" | bc -l) )); then
            echo "::warning::API response time is slow: ${TIME}s"
          fi
