# ============================================================
# CMS Platform — Health Check Workflow
# Runs every 5 minutes to verify production uptime
# ============================================================
name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check API Health (Production)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.cms.example.com/health)
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::API health check failed with status $RESPONSE"
            exit 1
          fi
          echo "::notice::API is healthy (HTTP $RESPONSE)"

      - name: Check Frontend Health (Production)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://app.cms.example.com/)
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Frontend health check failed with status $RESPONSE"
            exit 1
          fi
          echo "::notice::Frontend is healthy (HTTP $RESPONSE)"

      - name: Check API Response Time
        run: |
          TIME=$(curl -s -o /dev/null -w "%{time_total}" https://api.cms.example.com/health)
          echo "API response time: ${TIME}s"
          # Alert if slower than 2 seconds
          if (( $(echo "$TIME > 2.0" | bc -l) )); then
            echo "::warning::API response time is slow: ${TIME}s"
          fi

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#alerts'
          fields: repo,message,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
