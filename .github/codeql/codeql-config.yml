name: "CodeQL analysis configuration"

# Generated/build artifacts and non-product documentation scripts are not
# reviewable source: build output under obj/ and bin/ is regenerated by the
# compiler (RegexGenerator.g.cs, HotReload scripts), and docs/diagrams holds
# rendered diagram assets. Alerts there are noise — 14 open findings pointed
# into runner-generated obj/ output alone. Product source under apps/,
# packages/ and tools/ remains fully analyzed. (Key spelling per the
# code-scanning config-file spec: paths-ignore.)
paths-ignore:
  - '**/obj/**'
  - '**/bin/**'
  - 'docs/diagrams/**'
