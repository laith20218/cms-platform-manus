# ============================================================
# CMS API — Railway Configuration
# Backend deployment to Railway.app
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "dotnet CMS.Api.dll"
healthcheckPath = "/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
sleepApplication = false

# Resource limits (Railway Pro tier)
[[deploy.resources]]
cpu = 1
memory = 512

# Environment variables that should be configured in Railway dashboard:
# - POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD (auto from Railway PostgreSQL service)
# - REDIS_PASSWORD (auto from Railway Redis service)
# - JWT_SECRET (manually set, min 32 chars)
# - JWT_ISSUER, JWT_AUDIENCE
# - CORS_STUDENT_APP, CORS_ADMIN_APP (frontend URLs)
# - R2_ACCOUNT_ID, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL
# - WHATSAPP_TOKEN, WHATSAPP_PHONE_ID
# - FIREBASE_PROJECT_ID, FIREBASE_SERVICE_ACCOUNT (as JSON)
